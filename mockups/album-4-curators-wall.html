<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Album Redesign — 04 Curator's Wall</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --yellow: #F4CA16;
    --bg: #FFFFFF;
    --fg: #0A0A0A;
    --muted: rgba(0,0,0,0.45);
    --faint: rgba(0,0,0,0.32);
    --rule: #d4d0c8;
    --ease: cubic-bezier(0.25, 1, 0.5, 1);
    --dur: 0.7s;
    --pad: 40px;
  }

  [data-theme="dark"] {
    --bg: #0A0A0A;
    --fg: #FFFFFF;
    --muted: rgba(255,255,255,0.5);
    --faint: rgba(255,255,255,0.36);
    --rule: #222;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Newsreader', Georgia, serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    transition: background 0.4s ease, color 0.4s ease;
  }

  .theme-toggle {
    position: fixed;
    right: 32px;
    bottom: 28px;
    z-index: 60;
    background: var(--bg);
    border: 1px solid var(--rule);
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 0.55rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    padding: 9px 14px;
    cursor: pointer;
    transition: color 0.3s, border-color 0.3s;
  }
  .theme-toggle:hover { color: var(--fg); border-color: var(--yellow); }

  .wrap {
    max-width: 1500px;
    margin: 0 auto;
    padding: 0 var(--pad);
  }

  /* ---------- Colophon header ---------- */

  .colophon {
    padding: 84px 0 0;
  }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'Space Mono', monospace;
    font-size: 0.63rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--faint);
    text-decoration: none;
    margin-bottom: 56px;
    transition: color 0.3s;
  }
  .back:hover { color: var(--fg); }
  .back .arrow { display: inline-block; transition: transform 0.3s var(--ease); }
  .back:hover .arrow { transform: translateX(-5px); }

  .colophon-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 60px;
    align-items: end;
    padding-bottom: 30px;
  }

  h1 {
    font-size: clamp(3rem, 8vw, 6.5rem);
    font-weight: 300;
    line-height: 0.92;
    letter-spacing: -0.025em;
  }

  .intro {
    margin-top: 20px;
    max-width: 520px;
    font-size: 1.05rem;
    font-weight: 300;
    font-style: italic;
    line-height: 1.65;
    color: var(--muted);
  }

  .ledger {
    font-family: 'Space Mono', monospace;
    font-size: 0.58rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--muted);
  }
  .ledger-row {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 9px 0;
    border-bottom: 1px solid var(--rule);
  }
  .ledger-row:first-child { border-top: 1px solid var(--rule); }
  .ledger-row b { color: var(--fg); font-weight: 400; }

  /* ---------- Plates ---------- */

  .plate {
    border-top: 1px solid var(--rule);
    padding: 26px 0 88px;
  }

  .plate-mark {
    margin-bottom: 30px;
    font-family: 'Space Mono', monospace;
    font-size: 0.55rem;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--yellow);
  }

  /* Layout variants */

  .row {
    display: flex;
    gap: 22px;
    align-items: flex-start;
  }
  .plate[data-layout="inset"][data-align="right"] .row { justify-content: flex-end; }

  .unit { display: block; width: 100%; }
  .plate[data-layout="pair"] .unit,
  .plate[data-layout="triple"] .unit { width: auto; }
  /* Smart singles: portraits stay narrow; landscapes take most of the measure. */
  .plate[data-layout="inset"] .unit { width: min(46%, 560px); }
  .plate[data-layout="inset"][data-orient="landscape"] .unit { width: min(82%, 1100px); }
  .plate[data-layout="inset"][data-orient="pano"] .unit { width: 100%; }
  .plate[data-layout="inset"][data-size="large"] .unit { width: min(68%, 780px); }
  .plate[data-layout="triple"] .row { gap: 16px; }

  .frame {
    overflow: hidden;
    position: relative;
    display: block;
  }

  /* The opener breaks the measure and runs the full viewport width.
     --sbw discounts the scrollbar so 100vw does not force horizontal overflow. */
  .plate[data-layout="bleed"] .frame {
    width: calc(100vw - var(--sbw, 0px));
    margin-left: calc(50% - (100vw - var(--sbw, 0px)) / 2);
  }

  .frame img {
    display: block;
    width: 100%;
    height: auto;
    opacity: 0;
    transform: scale(1.045);
    transition: opacity 0.9s var(--ease), transform 1.6s var(--ease);
  }

  .plate[data-in="true"] .frame img {
    opacity: 1;
    transform: scale(1);
  }

  .plate[data-layout="bleed"] .frame img {
    height: 82vh;
    object-fit: cover;
  }

  /* Caption: filmstrip essay structure under each frame —
     mono N / total, larger Newsreader location, small mono meta. */

  .cap {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--rule);
    transition: border-color var(--dur) var(--ease);
  }

  .cap-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 10px;
  }

  .cap-num {
    font-family: 'Space Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--fg);
  }

  .cap-edition {
    font-family: 'Space Mono', monospace;
    font-size: 0.54rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: right;
    flex-shrink: 0;
  }
  .cap-edition[data-sold="true"] {
    color: var(--faint);
  }

  .cap-loc {
    font-family: 'Newsreader', Georgia, serif;
    font-size: clamp(1.25rem, 1.8vw, 1.55rem);
    font-weight: 300;
    line-height: 1.15;
    letter-spacing: -0.01em;
    color: var(--fg);
  }
  /* Multi-column plates are narrower — keep the serif location readable. */
  .plate[data-layout="pair"] .cap-loc {
    font-size: clamp(1.15rem, 1.5vw, 1.35rem);
  }
  .plate[data-layout="triple"] .cap-loc {
    font-size: clamp(1.05rem, 1.3vw, 1.2rem);
  }
  .plate[data-layout="triple"] .cap-edition {
    font-size: 0.48rem;
    letter-spacing: 0.12em;
  }

  .cap-print {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 2px solid var(--yellow);
    font-family: 'Space Mono', monospace;
    font-size: 0.54rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    line-height: 2;
  }
  .cap-print .price { color: var(--fg); display: block; }
  .cap-print .avail { color: var(--muted); display: block; }
  .cap-print[data-sold="true"] { border-top-color: var(--rule); }
  .cap-print[data-sold="true"] .price { color: var(--faint); }
  .cap-print a {
    display: inline-block;
    margin-top: 8px;
    color: var(--fg);
    text-decoration: none;
    border-bottom: 1px solid var(--yellow);
    padding-bottom: 2px;
  }

  .unit:hover .cap { border-top-color: var(--yellow); }

  /* ---------- Colophon footer ---------- */

  .end {
    border-top: 1px solid var(--rule);
    padding: 40px 0 120px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    font-family: 'Space Mono', monospace;
    font-size: 0.58rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--muted);
  }
  .end a {
    color: var(--fg);
    text-decoration: none;
    border-bottom: 1px solid var(--yellow);
    padding-bottom: 3px;
  }

  .plate {
    opacity: 0;
    transform: translateY(16px);
  }
  .plate[data-in="true"] {
    opacity: 1;
    transform: translateY(0);
    transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
    .plate, .frame img { opacity: 1; transform: none; }
  }

  @media (max-width: 900px) {
    :root { --pad: 20px; }
    .colophon-grid { grid-template-columns: 1fr; gap: 34px; align-items: start; }
    .row { flex-direction: column; gap: 34px; }
    .plate[data-layout="pair"] .unit,
    .plate[data-layout="triple"] .unit,
    .plate[data-layout="inset"] .unit { width: 100%; flex: none !important; }
    .plate[data-layout="bleed"] .frame img { height: 56vh; }
    .plate { padding-bottom: 60px; }
    .theme-toggle { right: 20px; bottom: 20px; }
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle">Dark</button>

<div class="wrap">
  <header class="colophon">
    <a class="back" href="album-redesign-index.html"><span class="arrow">&larr;</span> Back to Albums</a>
    <div class="colophon-grid">
      <div>
        <h1>Favourites</h1>
        <p class="intro">A curated selection of my best shots across all locations and themes.</p>
      </div>
      <div class="ledger">
        <div class="ledger-row"><span>Plates</span><b id="plateCount">—</b></div>
        <div class="ledger-row"><span>Photographs</span><b id="photoCount">—</b></div>
        <div class="ledger-row"><span>Locations</span><b>14</b></div>
        <div class="ledger-row"><span>Editions available</span><b>5 of 6</b></div>
      </div>
    </div>
  </header>
</div>

<main id="plates"></main>

<div class="wrap">
  <footer class="end">
    <span id="endCount">Favourites</span>
    <a href="album-redesign-index.html">Back to Albums</a>
  </footer>
</div>

<script>
// Canonical Favourites sequence — numbered 01–42 in page order.
// (Old Eastern Europe frame removed; prior moves baked in.)
const RAW = [
  ["000160990012.jpg",2048,1358,"Home",0,0,0,""],
  ["000160980007.jpg",1358,2048,"Home",0,0,0,""],
  ["000160980013.jpg",1358,2048,"Home",5,1,180,"available"],
  ["000226830008.jpg",2048,1358,"Home",0,0,0,""],
  ["DSCF2458.jpg",1365,2048,"Home",0,0,0,""],
  ["DSCF0776.jpg",2048,1365,"Kyoto",0,0,0,""],
  ["DSCF0818.jpg",1366,2048,"Kyoto",0,0,0,""],
  ["DSCF0578.jpg",1638,2048,"Kyoto",0,0,0,""],
  ["DSCF0752.jpg",2048,1638,"Kyoto",0,0,0,""],
  ["DSCF1317.jpg",1639,2048,"Osaka",0,0,0,""],
  ["DSCF1364.jpg",1638,2048,"Osaka",0,0,0,""],
  ["DSCF1703.jpg",2048,1638,"Chengdu",0,0,0,""],
  ["DSCF0032.jpg",2048,1638,"Chengdu",0,0,0,""],
  ["DSCF3535.jpg",2048,1638,"Amsterdam",5,4,280,"available"],
  ["DSCF4457.jpg",2048,931,"Bordeaux",0,0,0,""],
  ["DSCF4590.jpg",2048,1024,"Bordeaux",0,0,0,""],
  ["DSCF4666.jpg",1365,2048,"Bordeaux",5,0,240,"available"],
  ["DSCF4846.jpg",1638,2048,"Lisbon",0,0,0,""],
  ["DSCF4935.jpg",2048,1638,"Eastern Europe",0,0,0,""],
  ["DSCF5109.jpg",1536,2048,"Lisbon",0,0,0,""],
  ["DSCF5712.jpg",1365,2048,"Venice",0,0,0,""],
  ["DSCF5909.jpg",1365,2048,"Venice",0,0,0,""],
  ["DSCF6037.jpg",1638,2048,"Venice",0,0,0,""],
  ["DSCF6083.jpg",2048,1024,"Venice",0,0,0,""],
  ["DSCF6102.jpg",1639,2048,"Venice",0,0,0,""],
  ["DSCF6615.jpg",2048,1638,"Venice",5,1,250,"available"],
  ["DSCF7793.jpg",1365,2048,"Beijing",0,0,0,""],
  ["DSCF8021.jpg",1365,2048,"Beijing",0,0,0,""],
  ["000361140009.jpg",1358,2048,"Dublin",5,2,230,"available"],
  ["DSCF8148.jpg",1536,2048,"Beijing",0,0,0,""],
  ["DSCF8202.jpg",2048,1365,"Dublin",0,0,0,""],
  ["DSCF8286.jpg",2048,1365,"Dublin",0,0,0,""],
  ["DSCF8343.jpg",1638,2048,"Dublin",0,0,0,""],
  ["DSCF9708.jpg",2048,1024,"Tokyo",0,0,0,""],
  ["DSCF8848.jpg",1638,2048,"Hong Kong",0,0,0,""],
  ["DSCF8955.jpg",2048,1024,"Hong Kong",0,0,0,""],
  ["DSCF9580.jpg",1365,2048,"Tokyo",5,5,260,"sold_out"],
  ["DSCF5444.jpg",2048,864,"Lisbon",0,0,0,""],
  ["DSCF5866.jpg",2048,864,"Lisbon",0,0,0,""],
  ["img022.jpg",1377,2048,"Lisbon on film",0,0,0,""],
  ["img034.jpg",1345,2048,"Lisbon on film",0,0,0,""],
  ["img029.jpg",2048,1362,"Lisbon on film",0,0,0,""]
];
const PHOTOS = RAW.map((r, i) => ({ n: i + 1, file: r[0], w: r[1], h: r[2], loc: r[3], ed: r[4], sold: r[5], price: r[6], status: r[7] }));

function setScrollbarWidth() {
  const sbw = window.innerWidth - document.documentElement.clientWidth;
  document.documentElement.style.setProperty("--sbw", sbw + "px");
}
setScrollbarWidth();
window.addEventListener("resize", setScrollbarWidth);

const SRC = (f) => "../public/photos/Faves/" + encodeURIComponent(f);
const pad = (n) => String(n).padStart(2, "0");
const money = (v) => new Intl.NumberFormat("en-IE", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(v);
const ratio = (p) => p.w / p.h;

// No auto rhythm. Page order is exactly PHOTOS order.
// Only explicit groups below change layout; everything else is a smart single.
const FORCED_GROUPS = [
  { layout: "bleed", frames: [1] },
  { layout: "pair", frames: [3, 4] },
  { layout: "bleed", frames: [6] },
  { layout: "inset", frames: [7], size: "large" },
  { layout: "pair", frames: [8, 9] },
  { layout: "pair", frames: [27, 30] },
  { layout: "pair", frames: [28, 29] },
  { layout: "bleed", frames: [31] },
  { layout: "pair", frames: [10, 11] },
  { layout: "bleed", frames: [15] },
  { layout: "pair", frames: [17, 19] },
  { layout: "inset", frames: [18], size: "large" },
  { layout: "pair", frames: [22, 23] },
  { layout: "bleed", frames: [24] },
  { layout: "pair", frames: [25, 26] },
  { layout: "pair", frames: [37, 35] },
  { layout: "pair", frames: [32, 33] },
  { layout: "bleed", frames: [34] },
  { layout: "bleed", frames: [38] },
  { layout: "pair", frames: [20, 21] },
  { layout: "pair", frames: [40, 41] },
];

const byNumber = new Map(PHOTOS.map((p) => [p.n, p]));
const groupOf = new Map();
FORCED_GROUPS.forEach((group) => {
  group.frames.forEach((n) => groupOf.set(n, group));
});

const plates = [];
const used = new Set();

PHOTOS.forEach((photo) => {
  if (used.has(photo.n)) return;

  const group = groupOf.get(photo.n);
  if (group) {
    // Emit a group when we reach its earliest frame in page order.
    const first = Math.min(...group.frames);
    if (photo.n !== first) return;
    const photos = group.frames.map((n) => byNumber.get(n)).filter(Boolean);
    if (photos.length !== group.frames.length) return;
    photos.forEach((p) => used.add(p.n));
    plates.push({ layout: group.layout, photos, size: group.size });
    return;
  }

  used.add(photo.n);
  plates.push({ layout: "inset", photos: [photo] });
});

const shown = plates.reduce((n, plate) => n + plate.photos.length, 0);
const total = shown;

const platesEl = document.getElementById("plates");
document.getElementById("plateCount").textContent = plates.length;
document.getElementById("photoCount").textContent = String(shown);
document.getElementById("endCount").textContent = "Favourites — " + shown + " frames";

function orientOf(p) {
  const r = ratio(p);
  if (r > 1.9) return "pano";
  if (r > 1) return "landscape";
  return "portrait";
}

plates.forEach((plate, i) => {
  const section = document.createElement("section");
  section.className = "plate";
  section.dataset.layout = plate.layout;
  section.dataset.align = i % 2 === 0 ? "left" : "right";
  if (plate.layout === "inset" && plate.photos[0]) {
    section.dataset.orient = orientOf(plate.photos[0]);
  }
  if (plate.size) section.dataset.size = plate.size;

  const wrap = document.createElement("div");
  wrap.className = "wrap";

  const mark = document.createElement("div");
  mark.className = "plate-mark";
  mark.textContent = "Plate " + pad(i + 1);
  wrap.appendChild(mark);

  const row = document.createElement("div");
  row.className = "row";

  plate.photos.forEach((p) => {
    const unit = document.createElement("div");
    unit.className = "unit";
    if (plate.layout === "pair" || plate.layout === "triple") {
      // Match heights across the row by weighting flex to aspect ratio.
      unit.style.flex = ratio(p) + " " + ratio(p) + " 0%";
    }

    const frame = document.createElement("div");
    frame.className = "frame";
    const img = document.createElement("img");
    img.src = SRC(p.file);
    img.alt = p.loc;
    img.loading = "lazy";
    frame.appendChild(img);

    const cap = document.createElement("div");
    cap.className = "cap";

    const head = document.createElement("div");
    head.className = "cap-head";

    const num = document.createElement("span");
    num.className = "cap-num";
    num.textContent = pad(p.n) + " / " + pad(total);
    head.appendChild(num);

    if (p.ed) {
      const sold = p.status === "sold_out";
      const edition = document.createElement("span");
      edition.className = "cap-edition";
      edition.dataset.sold = String(sold);
      edition.textContent = sold
        ? "Sold out"
        : "Edition of " + p.ed + " · " + p.sold + " sold";
      head.appendChild(edition);
    }

    const loc = document.createElement("div");
    loc.className = "cap-loc";
    loc.textContent = p.loc;

    cap.appendChild(head);
    cap.appendChild(loc);

    if (p.ed) {
      const sold = p.status === "sold_out";
      const print = document.createElement("div");
      print.className = "cap-print";
      print.dataset.sold = String(sold);
      print.innerHTML =
        '<span class="price">' + (sold ? "Sold out" : money(p.price)) + "</span>";
      if (!sold) {
        const cta = document.createElement("a");
        cta.href = "#";
        cta.textContent = "Enquire →";
        print.appendChild(cta);
      }
      cap.appendChild(print);
    }

    unit.appendChild(frame);
    unit.appendChild(cap);
    row.appendChild(unit);
  });

  wrap.appendChild(row);
  section.appendChild(wrap);
  platesEl.appendChild(section);
});

const observer = new IntersectionObserver(
  (entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.dataset.in = "true";
        observer.unobserve(entry.target);
      }
    });
  },
  { rootMargin: "0px 0px -10% 0px" }
);
document.querySelectorAll(".plate").forEach((el) => observer.observe(el));

// Recompute now that the plates exist and the scrollbar has appeared.
setScrollbarWidth();

const toggle = document.getElementById("themeToggle");
toggle.addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  toggle.textContent = next === "dark" ? "Light" : "Dark";
});
</script>
</body>
</html>
