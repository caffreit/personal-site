{"id":"athena","name":"Athena","depth":5},{"id":"leto","name":"Leto","depth":4},{"id":"apollo","name":"Apollo","depth":5},{"id":"artemis","name":"Artemis","depth":5},{"id":"maia","name":"Maia","depth":4},{"id":"hermes","name":"Hermes","depth":5},{"id":"semele","name":"Semele","depth":4},{"id":"dionysus","name":"Dionysus","depth":5},{"id":"ares","name":"Ares","depth":5},{"id":"hephaestus","name":"Hephaestus","depth":5},{"id":"hebe","name":"Hebe","depth":5},{"id":"persephone","name":"Persephone","depth":5},{"id":"nereus","name":"Nereus","depth":3},{"id":"doris","name":"Doris","depth":4},{"id":"nereids","name":"Nereids","depth":5},{"id":"hecatoncheires","name":"Hecatoncheires","depth":3},{"id":"elder_cyclopes","name":"Elder Cyclopes","depth":3},{"id":"erinyes","name":"Erinyes","depth":3},{"id":"gigantes","name":"Gigantes","depth":3},{"id":"moirai","name":"Moirai","depth":2},{"id":"keres","name":"Keres","depth":2},{"id":"nemesis","name":"Nemesis","depth":2},{"id":"eris","name":"Eris","depth":2},{"id":"hesperides","name":"Hesperides","depth":2},{"id":"eurybia","name":"Eurybia","depth":3},{"id":"perses","name":"Perses","depth":4},{"id":"asteria","name":"Asteria","depth":4},{"id":"hecate","name":"Hecate","depth":5},{"id":"muses","name":"Muses","depth":5},{"id":"horae","name":"Horae","depth":5},{"id":"eurynome","name":"Eurynome","depth":4},{"id":"charites","name":"Charites","depth":5}],"links":[["chaos","eros"],["chaos","gaia"],["chaos","tartarus"],["chaos","erebus"],["chaos","nyx"],["gaia","pontus"],["gaia","ourea"],["gaia","uranus"],["gaia","echidna"],["tartarus","echidna"],["gaia","typhon"],["tartarus","typhon"],["pontus","thaumas"],["pontus","phorcys"],["pontus","ceto"],["gaia","themis"],["uranus","themis"],["gaia","mnemosyne"],["uranus","mnemosyne"],["gaia","hyperion"],["uranus","hyperion"],["gaia","theia"],["uranus","theia"],["gaia","crius"],["uranus","crius"],["gaia","iapetus"],["uranus","iapetus"],["gaia","coeus"],["uranus","coeus"],["gaia","phoebe"],["uranus","phoebe"],["gaia","oceanus"],["uranus","oceanus"],["gaia","cronus"],["uranus","cronus"],["gaia","tethys"],["uranus","tethys"],["gaia","rhea"],["uranus","rhea"],["uranus","aphrodite"],["erebus","aether"],["nyx","aether"],["erebus","hemera"],["nyx","hemera"],["erebus","charon"],["nyx","charon"],["nyx","hypnos"],["nyx","thanatos"],["nyx","moros"],["cronus","hestia"],["rhea","hestia"],["cronus","demeter"],["rhea","demeter"],["cronus","hera"],["rhea","hera"],["cronus","hades"],["rhea","hades"],["cronus","poseidon"],["rhea","poseidon"],["cronus","zeus"],["rhea","zeus"],["hyperion","helios"],["theia","helios"],["hyperion","selene"],["theia","selene"],["hyperion","eos"],["theia","eos"],["iapetus","atlas"],["clymene","atlas"],["iapetus","prometheus"],["clymene","prometheus"],["iapetus","epimetheus"],["clymene","epimetheus"],["zeus","athena"],["metis","athena"],["zeus","apollo"],["leto","apollo"],["zeus","artemis"],["leto","artemis"],["zeus","hermes"],["maia","hermes"],["zeus","dionysus"],["semele","dionysus"],["zeus","ares"],["hera","ares"],["hera","hephaestus"],["zeus","hebe"],["hera","hebe"],["zeus","persephone"],["demeter","persephone"],["gaia","nereus"],["pontus","nereus"],["oceanus","doris"],["tethys","doris"],["nereus","nereids"],["doris","nereids"],["gaia","hecatoncheires"],["uranus","hecatoncheires"],["gaia","elder_cyclopes"],["uranus","elder_cyclopes"],["gaia","erinyes"],["uranus","erinyes"],["gaia","gigantes"],["uranus","gigantes"],["nyx","moirai"],["nyx","keres"],["nyx","nemesis"],["nyx","eris"],["nyx","hesperides"],["gaia","eurybia"],["pontus","eurybia"],["crius","perses"],["eurybia","perses"],["coeus","asteria"],["phoebe","asteria"],["perses","hecate"],["asteria","hecate"],["zeus","muses"],["mnemosyne","muses"],["zeus","horae"],["themis","horae"],["oceanus","eurynome"],["tethys","eurynome"],["zeus","charites"],["eurynome","charites"]],"lines":[{"id":"sovereignty","name":"Sovereignty line","color":"#d0312d","paths":[["chaos","gaia","uranus","cronus","zeus","athena"],["zeus","apollo"],["zeus","artemis"],["zeus","hermes"],["zeus","dionysus"],["zeus","ares"],["zeus","hebe"],["zeus","persephone"],["zeus","charites"]]},{"id":"promethean","name":"Promethean line","color":"#7a4ea6","paths":[["chaos","gaia","uranus","iapetus","prometheus"],["iapetus","atlas"]]},{"id":"sea","name":"Sea line","color":"#13a19d","paths":[["chaos","gaia","pontus","nereus","nereids"]]},{"id":"ocean","name":"Ocean line","color":"#1f5ea8","paths":[["chaos","gaia","uranus","oceanus","doris","nereids"],["oceanus","eurynome","charites"]]},{"id":"sun","name":"Sun line","color":"#f0a500","paths":[["chaos","gaia","uranus","hyperion","helios"],["hyperion","eos"]]},{"id":"hecate","name":"Hecate line","color":"#2e8b4b","paths":[["chaos","gaia","uranus","coeus","asteria","hecate"],["uranus","crius","perses","hecate"]]},{"id":"night","name":"Night line","color":"#1d1d1b","paths":[["chaos","nyx","moirai"],["nyx","thanatos"],["nyx","hypnos"]]},{"id":"memory","name":"Memory line","color":"#e0609c","paths":[["uranus","mnemosyne","muses"]]},{"id":"justice","name":"Justice line","color":"#9aa3a8","paths":[["uranus","themis","horae"]]},{"id":"hera","name":"Hera line","color":"#8c1c3c","paths":[["cronus","hera","ares"],["hera","hephaestus"],["hera","hebe"]]},{"id":"harvest","name":"Harvest line","color":"#8dc63f","paths":[["cronus","demeter","persephone"]]},{"id":"abyss","name":"Abyss line","color":"#7b5130","paths":[["chaos","tartarus","typhon"],["tartarus","echidna"]]},{"id":"erebus","name":"Erebus line","color":"#3b3f8f","paths":[["chaos","erebus","aether"],["erebus","hemera"],["erebus","charon"]]},{"id":"foam","name":"Foam line","color":"#62b5e5","paths":[["uranus","aphrodite"]]},{"id":"forge","name":"Forge line","color":"#ee7a12","paths":[["uranus","elder_cyclopes"],["uranus","hecatoncheires"]]}],"couples":[{"a":"zeus","b":"hera","weight":3},{"a":"zeus","b":"demeter","weight":1},{"a":"zeus","b":"eurynome","weight":1}],"levelNames":["Origin","Primordials","Primordial children","Titans and contemporaries","Olympians and younger Titans","Olympian children and contemporaries"]};
const VARIANTS=[{key:'ltr',name:'A · Left to right'},{key:'ring',name:'B · Square rings'}];
const byId=Object.fromEntries(DATA.people.map(p=>[p.id,p]));
const LINES=DATA.lines,lineById=Object.fromEntries(LINES.map(l=>[l.id,l]));
const FONT='Inter, "Helvetica Neue", Arial, sans-serif';
const LW=8,GAP=11,LANE=14,CORNER=20;

const V=(x,y)=>({x,y}),add=(a,b)=>V(a.x+b.x,a.y+b.y),sub=(a,b)=>V(a.x-b.x,a.y-b.y),mul=(a,k)=>V(a.x*k,a.y*k);
const len=a=>Math.hypot(a.x,a.y),norm=a=>{const l=len(a)||1;return V(a.x/l,a.y/l)},dot=(a,b)=>a.x*b.x+a.y*b.y,cross=(a,b)=>a.x*b.y-a.y*b.x;
const leftN=d=>V(d.y,-d.x),dist=(a,b)=>len(sub(a,b));

// ---------- network: stations, track segments, tree of first appearance ----------
const segMap=new Map(),stations=[],treeParent={},kids={};
for(const L of LINES)for(const path of L.paths)path.forEach((id,i)=>{
  if(!stations.includes(id)){stations.push(id);kids[id]=[];if(i>0){treeParent[id]=path[i-1];kids[path[i-1]].push(id)}}
  if(i>0){const a=path[i-1],key=a+'>'+id;if(!segMap.has(key))segMap.set(key,{key,a,b:id,lines:[]});const s=segMap.get(key);if(!s.lines.includes(L.id))s.lines.push(L.id)}
});
const segs=[...segMap.values()];
const outOf=id=>segs.filter(s=>s.a===id),inTo=id=>segs.filter(s=>s.b===id);
const linesAt=Object.fromEntries(stations.map(id=>[id,new Set()]));
for(const s of segs)for(const l of s.lines){linesAt[s.a].add(l);linesAt[s.b].add(l)}
const otherParentLinks=DATA.links.filter(([a,b])=>stations.includes(a)&&stations.includes(b)&&!segMap.has(a+'>'+b));

// ---------- geometry helpers ----------
function clean(pts){
  const out=[];for(const p of pts){if(out.length&&dist(out.at(-1),p)<.5)continue;out.push(p)}
  for(let i=out.length-2;i>0;i--){const u=sub(out[i],out[i-1]),w=sub(out[i+1],out[i]);if(Math.abs(cross(u,w))<1e-6*len(u)*len(w)+1e-9&&dot(u,w)>0)out.splice(i,1)}
  return out;
}
function segX(p1,p2,p3,p4){const d1=sub(p2,p1),d2=sub(p4,p3),den=cross(d1,d2);if(Math.abs(den)<1e-9)return false;const t=cross(sub(p3,p1),d2)/den,u=cross(sub(p3,p1),d1)/den;return t>1e-6&&t<1-1e-6&&u>1e-6&&u<1-1e-6}
function bbox(pts){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const p of pts){x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y)}return {x0,y0,x1,y1}}
function polyCross(a,b){
  const A=a.bb??=bbox(a),B=b.bb??=bbox(b);if(A.x1<B.x0||B.x1<A.x0||A.y1<B.y0||B.y1<A.y0)return 0;
  let n=0;for(let i=1;i<a.length;i++)for(let j=1;j<b.length;j++)if(segX(a[i-1],a[i],b[j-1],b[j]))n++;return n;
}
function pointSegDist(p,a,b){const d=sub(b,a),t=Math.max(0,Math.min(1,dot(sub(p,a),d)/(dot(d,d)||1)));return dist(p,add(a,mul(d,t)))}
// Layout score used by both searches: crossings and track running through other stations dominate, then total track length.
function layoutCost(lay){
  const polys=segs.map(s=>lay.route(s,lay.pos[s.a],lay.pos[s.b]));let cr=0,L=0,through=0;
  for(let i=0;i<polys.length;i++){
    for(let k=1;k<polys[i].length;k++)L+=dist(polys[i][k-1],polys[i][k]);
    for(let j=i+1;j<polys.length;j++)cr+=polyCross(polys[i],polys[j]);
    for(const v of stations){if(v===segs[i].a||v===segs[i].b)continue;for(let k=1;k<polys[i].length;k++)if(pointSegDist(lay.pos[v],polys[i][k-1],polys[i][k])<16){through++;break}}
  }
  const apart=coupleDistance(lay.pos);
  return {cr,through,L,apart,cost:cr*1000+through*700+L+apart};
}
// Weighted distance between partners, so couples with shared children sit near each other.
const coupleDistance=pos=>DATA.couples.reduce((s,c)=>s+c.weight*dist(pos[c.a],pos[c.b]),0);
function offsetPoly(pts,off){
  if(!off)return pts.slice();
  return pts.map((p,i)=>{
    const dp=i>0?norm(sub(p,pts[i-1])):null,dn=i<pts.length-1?norm(sub(pts[i+1],p)):null;
    if(!dp)return add(p,mul(leftN(dn),off));if(!dn)return add(p,mul(leftN(dp),off));
    const n1=leftN(dp),m=norm(add(n1,leftN(dn)));return add(p,mul(m,off/Math.max(.3,dot(m,n1))));
  });
}
const f=p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`;
function roundedD(pts,r){
  let d=`M${f(pts[0])}`;
  for(let i=1;i<pts.length-1;i++){const a=pts[i-1],b=pts[i],c=pts[i+1],rr=Math.min(r,dist(a,b)/2,dist(b,c)/2);d+=` L${f(add(b,mul(norm(sub(a,b)),rr)))} Q${f(b)} ${f(add(b,mul(norm(sub(c,b)),rr)))}`}
  return d+` L${f(pts.at(-1))}`;
}
function rectHit(r,a,b){
  let t0=0,t1=1;const dx=b.x-a.x,dy=b.y-a.y;
  for(const [p,q] of [[-dx,a.x-r.x],[dx,r.x+r.w-a.x],[-dy,a.y-r.y],[dy,r.y+r.h-a.y]]){
    if(Math.abs(p)<1e-12){if(q<0)return false}else{const t=q/p;if(p<0){if(t>t1)return false;if(t>t0)t0=t}else{if(t<t0)return false;if(t<t1)t1=t}}
  }
  return true;
}
const rectsOverlap=(a,b)=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;
const inflate=(r,k)=>({x:r.x-k,y:r.y-k,w:r.w+2*k,h:r.h+2*k});
const measure=(()=>{const ctx=document.createElement('canvas').getContext('2d');return(text,size,weight)=>{ctx.font=`${weight} ${size}px ${FONT}`;return ctx.measureText(text).width}})();
function* permutations(xs){if(xs.length<=1){yield xs.slice();return}for(let i=0;i<xs.length;i++){const rest=[...xs.slice(0,i),...xs.slice(i+1)];for(const p of permutations(rest))yield [xs[i],...p]}}

// Octilinear route with the 45° bend just after the start ("peel off"), for left-to-right flow.
function routeLTR(P,Q){
  const dx=Q.x-P.x,dy=Q.y-P.y;if(Math.abs(dy)<.5)return [P,Q];
  const s=Math.min(34,dx/4),d=Math.min(Math.abs(dy),dx-2*s),sg=Math.sign(dy);
  const pts=[P,V(P.x+s,P.y),V(P.x+s+d,P.y+sg*d)];if(Math.abs(dy)>d+.5)pts.push(V(P.x+s+d,Q.y));pts.push(Q);return clean(pts);
}
// Symmetric octilinear route along the dominant axis.
function routeOcti(P,Q){
  const dx=Q.x-P.x,dy=Q.y-P.y,ax=Math.abs(dx),ay=Math.abs(dy);
  if(ax<.5||ay<.5||Math.abs(ax-ay)<.5)return [P,Q];
  if(ax>ay){const h=(ax-ay)/2*Math.sign(dx);return [P,V(P.x+h,P.y),V(Q.x-h,Q.y),Q]}
  const h=(ay-ax)/2*Math.sign(dy);return [P,V(P.x,P.y+h),V(Q.x,Q.y-h),Q];
}

// Replace any leg that isn't at 0°, 45° or 90° with an octilinear two-bend route between its ends.
function octilinear(pts){
  const out=[pts[0]];
  for(let i=1;i<pts.length;i++){
    const a=out.at(-1),b=pts[i],ax=Math.abs(b.x-a.x),ay=Math.abs(b.y-a.y);
    if(ax<.5||ay<.5||Math.abs(ax-ay)<.5)out.push(b);else out.push(...routeOcti(a,b).slice(1));
  }
  return clean(out);
}

// ---------- Variant A: zones as vertical bands, rows chosen greedily ----------
// Hill-climb an ordering by moving one item to another position until nothing improves; exhaustive when short.
function improveOrder(items,evaluate,maxEvals=1e9){
  let tried=0,best=null;const run=o=>{if(tried>=maxEvals)return false;tried++;const r=evaluate(o);if(!best||r.c.cost<best.c.cost-1e-6){best={...r,order:o};return true}return false};
  if(items.length<=5){for(const p of permutations(items))run(p);return {best,tried}}
  run(items);
  for(let pass=0;pass<4;pass++){let improved=false;
    for(let i=0;i<items.length;i++)for(let j=0;j<items.length;j++){if(i===j)continue;const o=best.order.slice(),[x]=o.splice(i,1);o.splice(j,0,x);if(run(o))improved=true}
    if(!improved)break}
  return {best,tried};
}
function searchLTR(){
  const [first,...rest]=LINES;
  const {best,tried}=improveOrder(rest,o=>{const lay=layoutLTR([first,...o]);return {lay,c:layoutCost(lay)}});
  const moves=refine(best.lay.pos,{route:routeLTR,G:best.lay.ROW,MIN:best.lay.ROW-1,offsets:[-4,-3,-2,-1,1,2,3,4].map(j=>V(0,j))});
  return Object.assign(best.lay,{search:`${tried} line placement orders + ${moves} station moves`,score:layoutCost(best.lay)});
}
function layoutLTR(order){
  const ZW=300,ROW=64,P=(z,r)=>V(z*ZW,r*ROW);
  const row={chaos:0},occ=new Map([['0,0','s']]),placed=[];
  // Seat a whole generation before the next, so both parents of a shared child are on the map when it is placed.
  const steps=order.flatMap((L,li)=>L.paths.flatMap(path=>path.slice(1).map((b,k)=>({a:path[k],b,li}))));
  steps.sort((x,y)=>byId[x.b].depth-byId[y.b].depth);
  steps.forEach(({a,b,li})=>{
    const za=byId[a].depth,zb=byId[b].depth;
    if(row[b]===undefined){
      const ra=row[a],others=inTo(b).map(s=>s.a).filter(p=>p!==a&&row[p]!==undefined);let best=null;
      for(let r=ra-12;r<=ra+12;r++){
        if(occ.has(zb+','+r))continue;
        let blocked=false;for(let z=za+1;z<zb;z++)if(occ.get(z+','+r)==='s')blocked=true;if(blocked)continue;
        let cr=0;for(const p of [a,...others]){const poly=routeLTR(P(byId[p].depth,row[p]),P(zb,r));for(const q of placed)cr+=polyCross(poly,q)}
        let cost=Math.abs(r-ra)+cr*6+((r<ra)===(li%2===0)?0:.2);
        for(const p of others)cost+=Math.abs(r-row[p])*.5;
        for(const c of DATA.couples){const o=c.a===b?c.b:c.b===b?c.a:null;if(o&&row[o]!==undefined)cost+=c.weight*Math.abs(r-row[o])*.8}
        if(!best||cost<best.cost)best={r,cost};
      }
      row[b]=best.r;occ.set(zb+','+best.r,'s');for(let z=za+1;z<zb;z++)if(!occ.has(z+','+best.r))occ.set(z+','+best.r,'t');
    }
    placed.push(routeLTR(P(za,row[a]),P(zb,row[b])));
  });
  const pos={};for(const id of stations)pos[id]=P(byId[id].depth,row[id]);
  return {kind:'ltr',pos,ZW,ROW,route:(s,A,B)=>routeLTR(A,B),labelPrefs:()=>['N','S','NE','SE','E','NW','SW','W'],lanes:{}};
}

// ---------- Variant B: zones as square rings, lines travel along zone boundaries ----------
// Coordinate descent over each station's sibling order (the radial analogue of crossing-minimising layer ordering).
function searchRing(){

// Local search shared by the layouts: move single stations to nearby grid points while that lowers crossings, pass-throughs and track length.

// ---------- shared: line order, bundles, stations, labels ----------
function countCrossings(rank,pos){
  let n=0;
  const ang=(d,u)=>Math.atan2(-cross(d,u),dot(d,u));
  for(const e of segs){
    if(e.lines.length<2)continue;const d=norm(sub(pos[e.b],pos[e.a]));
    for(const p of e.lines)for(const q of e.lines){
      if(rank[p]>=rank[q])continue;
      const op=outOf(e.b).filter(s=>s.lines.includes(p)),oq=outOf(e.b).filter(s=>s.lines.includes(q));
      for(const x of op)for(const y of oq){if(x===y)continue;if(ang(d,sub(pos[x.b],pos[e.b]))<ang(d,sub(pos[y.b],pos[e.b]))-1e-6)n++}
    }
  }

}

const layoutCache={};

const NS='http://www.w3.org/2000/svg';

const txt=(parent,x,y,s,attrs={})=>{const t=el('text',{x,y,'font-family':FONT,...attrs},parent);t.textContent=s;return t};

  // header
  txt(svg,left+pad,top+52,'A NEW MAP OF THE GENEALOGY',{'font-size':12,'font-weight':800,'letter-spacing':'.2em',fill:'#7a776d'});
  txt(svg,left+pad,top+108,'Theogony Underground',{'font-size':54,'font-weight':800,'letter-spacing':'-.035em',fill:'#1b1c19'});
  txt(svg,left+pad,top+142,`${LINES.length} lineages from Chaos, drawn as a transit map. Fare zones are generations. Prototype · automatic layout · ${VARIANTS.find(v=>v.key===variant).name}`,{'font-size':16,'font-weight':500,fill:'#5a5a52'});
  el('line',{x1:left+pad,x2:left+W-pad,y1:top+header-12,y2:top+header-12,stroke:'#dedcd3'},svg);

    for(let k=0;k<=maxZone;k++){

      wrap(DATA.levelNames[k],lay.ZW-32,13).forEach((s,i)=>txt(zg,zx+16,y0+46+i*17,s,{'font-size':13,'font-weight':560,fill:'#6b685f'}));
    }
  }else{
    const R=lay.R,river=(maxZone+.5)*R+34;
    el('rect',{x:-river,y:-river,width:2*river,height:2*river,rx:48,fill:'none',stroke:'#cfe3ee',"stroke-width":30},zg);
    txt(zg,0,-river+5,'O K E A N O S',{'font-size':13,'font-weight':700,'text-anchor':'middle',fill:'#6f9bb6','font-style':'italic'});
    for(let k=maxZone;k>=0;k--){const s=(k+.5)*R;el('rect',{x:-s,y:-s,width:2*s,height:2*s,rx:k?22:30,fill:zoneFill(k),stroke:'#e2dfd5','stroke-width':1},zg)}
    for(let k=0;k<=maxZone;k++){const s=(k+.5)*R;txt(zg,-s+(k?34:12),-s+(k?44:20),k?`ZONE ${k} · ${DATA.levelNames[k].toUpperCase()}`:'ZONE 0',{'font-size':11,'font-weight':800,'letter-spacing':'.12em',fill:'#9a978b'})}
  }

  // other-parent links
  if(showOthers){const og=el('g',{},svg);for(const [a,b] of otherParentLinks)el('line',{x1:pos[a].x,y1:pos[a].y,x2:pos[b].x,y2:pos[b].y,stroke:'#8d8a80','stroke-width':1.6,'stroke-dasharray':'5 5',opacity:.85},og)}

  // tracks: white casing then colour, line by line, so crossings read as bridges
  const tg=el('g',{fill:'none','stroke-linejoin':'round','stroke-linecap':'butt'},svg);
  for(const t of B.tracks){const d=roundedD(t.pts,CORNER);el('path',{d,stroke:'#fbfaf6','stroke-width':LW+4},tg);el('path',{d,stroke:t.line.color,'stroke-width':LW},tg)}

  // stations
  const sg=el('g',{},svg);
  for(const m of B.markers){
    const p=pos[m.v];
    if(m.type==='tick'){const q=add(p,mul(m.n,(m.side||1)*(LW/2+7)));el('line',{x1:p.x,y1:p.y,x2:q.x,y2:q.y,stroke:m.color,'stroke-width':5.5},sg)}
    else{const w=m.v==='chaos'?26:19;el('line',{x1:m.a.x,y1:m.a.y,x2:m.b.x,y2:m.b.y,stroke:'#1d1d1b','stroke-width':w,'stroke-linecap':'round'},sg);el('line',{x1:m.a.x,y1:m.a.y,x2:m.b.x,y2:m.b.y,stroke:'#fff','stroke-width':w-7,'stroke-linecap':'round'},sg)}
  }
  const lg=el('g',{},svg);
  B.labels.forEach(l=>{if(l)txt(lg,l.r.x+1,l.r.y+l.size*.86,l.name,{'font-size':l.size,'font-weight':l.weight,fill:'#1d1d1b','letter-spacing':'-.01em'})});

  // footer key
  const fy=y1+pad+10,colW=(W-2*pad)/3,fx=left+pad;
  el('line',{x1:fx,x2:left+W-pad,y1:fy,y2:fy,stroke:'#dedcd3'},svg);
  txt(svg,fx,fy+42,'Lines',{'font-size':19,'font-weight':800,fill:'#22231f'});
  LINES.forEach((L,i)=>{const y=fy+74+i*30;el('line',{x1:fx,x2:fx+40,y1:y-5,y2:y-5,stroke:L.color,'stroke-width':LW},svg);txt(svg,fx+54,y,L.name,{'font-size':15,'font-weight':700,fill:'#26271f'});
    const all=L.paths.map(p=>byId[p.at(-1)].name);
    const ends=all.length>5?`${all.slice(0,4).join(' · ')} + ${all.length-4} more`:all.join(' · ');txt(svg,fx+54+measure(L.name,15,700)+10,y,`to ${ends}`,{'font-size':13.5,'font-weight':500,fill:'#6b685f'})});
  const zx=fx+colW;txt(svg,zx,fy+42,'Fare zones = generations',{'font-size':19,'font-weight':800,fill:'#22231f'});
  DATA.levelNames.slice(0,maxZone+1).forEach((n,k)=>{const y=fy+74+k*30;el('rect',{x:zx,y:y-16,width:40,height:22,fill:zoneFill(k),stroke:'#dedcd3'},svg);txt(svg,zx+20,y,String(k),{'font-size':13,'font-weight':800,'text-anchor':'middle',fill:'#7a776d'});txt(svg,zx+54,y,n,{'font-size':15,'font-weight':560,fill:'#30312b'})});
  const rx=fx+2*colW;txt(svg,rx,fy+42,'Reading the map',{'font-size':19,'font-weight':800,fill:'#22231f'});
  const ex=(y,kind)=>{if(kind==='pill'){el('line',{x1:rx+8,x2:rx+30,y1:y-5,y2:y-5,stroke:'#1d1d1b','stroke-width':19,'stroke-linecap':'round'},svg);el('line',{x1:rx+8,x2:rx+30,y1:y-5,y2:y-5,stroke:'#fff','stroke-width':12,'stroke-linecap':'round'},svg)}
    else if(kind==='tick'){el('line',{x1:rx,x2:rx+40,y1:y-5,y2:y-5,stroke:'#d0312d','stroke-width':LW},svg);el('line',{x1:rx+20,x2:rx+20,y1:y-5,y2:y-16,stroke:'#d0312d','stroke-width':5.5},svg)}
    else el('line',{x1:rx,x2:rx+40,y1:y-5,y2:y-5,stroke:'#8d8a80','stroke-width':1.6,'stroke-dasharray':'5 5'},svg)};
  [['tick','Station: a figure on one line'],['pill','Interchange: lines meet or share track'],['dash','Other parent, not on a line (toggle)']].forEach(([k,s],i)=>{const y=fy+74+i*30;ex(y,k);txt(svg,rx+54,y,s,{'font-size':15,'font-weight':560,fill:'#30312b'})});
  wrap('Consecutive stops on a line are parent and child. Where two parents\u2019 lines arrive side by side, the station is their child: Ares and Hebe are children of Zeus and Hera. Zone number is the longest recorded descent from Chaos, so a line may pass through a zone without stopping. Only the lineages above are drawn; the full genealogy has 79 figures.',colW-30,13.5)
    .forEach((s,i)=>txt(svg,rx,fy+178+i*19,s,{'font-size':13.5,'font-weight':500,fill:'#5f5d55'}));

  document.getElementById('state').textContent=`${stations.length} stations · layout: ${lay.score.cr} crossings, ${lay.score.through} pass-throughs, Zeus–Hera ${Math.round(dist(pos.zeus,pos.hera))} apart, searched ${lay.search} · bundle order: ${B.best.c} crossings (of ${B.tried}) · ${otherParentLinks.length} other-parent links ${showOthers?'shown':'hidden'}`;
}

// ---------- prototype switcher ----------
const params=new URLSearchParams(location.search);
let vi=Math.max(0,VARIANTS.findIndex(v=>v.key===params.get('variant')));
const othersBox=document.getElementById('others');othersBox.checked=params.get('others')==='1';
function go(i){vi=(i+VARIANTS.length)%VARIANTS.length;const p=new URLSearchParams(location.search);p.set('variant',VARIANTS[vi].key);if(othersBox.checked)p.set('others','1');else p.delete('others');history.replaceState(null,'','?'+p);document.getElementById('vname').textContent=VARIANTS[vi].name;render(VARIANTS[vi].key,othersBox.checked)}
document.getElementById('prev').onclick=()=>go(vi-1);document.getElementById('next').onclick=()=>go(vi+1);othersBox.onchange=()=>go(vi);
addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')go(vi-1);if(e.key==='ArrowRight')go(vi+1)});
go(vi);
</script>
